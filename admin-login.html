<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | Oxygen Gym</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
:root{--bg:#080808;--panel:#111;--text:#f4f4f4;--muted:#a5a5a5;--accent:#c7ff00;--border:#292929}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;line-height:1.5}
.card{width:min(430px,100%);padding:40px;background:var(--panel);border:1px solid var(--border);border-radius:10px}
.brand{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:900;letter-spacing:1px;font-size:19px;margin-bottom:30px;color:#fff;text-decoration:none}
.brand span{display:inline-flex;background:var(--accent);color:#000;width:34px;height:34px;align-items:center;justify-content:center;border-radius:50%}
.brand b{font-weight:500;color:#777}
h1{font-size:34px;margin:0 0 6px;letter-spacing:-1px}
p{color:var(--muted);margin:0 0 24px;font-size:14px}
label{display:block;color:#bbb;font-size:13px;font-weight:600;margin-bottom:16px}
input{width:100%;margin-top:8px;padding:13px 14px;background:#090909;border:1px solid #333;border-radius:5px;color:#fff;font:inherit;outline:none}
input:focus{border-color:var(--accent)}
button{width:100%;margin-top:6px;padding:13px;background:var(--accent);color:#050505;border:0;border-radius:5px;font:inherit;font-weight:800;cursor:pointer}
button:hover{filter:brightness(.92)}
button:focus-visible,a:focus-visible{outline:2px solid #fff;outline-offset:2px}
.error{margin-top:16px;padding:13px;background:#260d0d;border:1px solid #612323;color:#ff9d9d;border-radius:5px;font-size:14px}
.back{display:block;text-align:center;margin-top:22px;font-size:13px;color:#777;text-decoration:none}
.back:hover{color:#fff}
.hint{margin-top:24px;padding-top:20px;border-top:1px solid var(--border);font-size:12px;color:#777}
</style>
</head>
<body>
<main class="card">
  <a class="brand" href="index.html"><span>O₂</span> OXYGEN <b>GYM</b></a>
  <h1>Admin sign in</h1>
  <p>Manage members, logins, attendance and fees.</p>
  <form id="adminForm" autocomplete="off">
    <label>Admin email<input id="email" type="email" required placeholder="admin@oxygengym.com"></label>
    <label>Password<input id="password" type="password" required placeholder="Enter password"></label>
    <button type="submit">Sign in</button>
  </form>
  <div id="msg" role="alert"></div>
  <a class="back" href="index.html">Back to website</a>
  <p class="hint">Demo credentials: admin@oxygengym.com / admin123</p>
</main>

<script>
const ADMIN_SESSION_KEY = "oxygenGymAdmin";   // sessionStorage: ends when the tab closes
const ADMIN_EMAIL = "admin@oxygengym.com";
const ADMIN_PASSWORD = "admin123";

// Already signed in? Go straight to the dashboard.
try { if (sessionStorage.getItem(ADMIN_SESSION_KEY) === "1") location.replace("admin-dashboard.html"); } catch (e) {}

document.getElementById("adminForm").addEventListener("submit", function (e) {
  e.preventDefault();
  const email = document.getElementById("email").value.trim().toLowerCase();
  const pass = document.getElementById("password").value;
  const msg = document.getElementById("msg");
  if (email === ADMIN_EMAIL && pass === ADMIN_PASSWORD) {
    try { sessionStorage.setItem(ADMIN_SESSION_KEY, "1"); } catch (err) {}
    location.href = "admin-dashboard.html";
  } else {
    msg.innerHTML = '<div class="error">Incorrect email or password. Check both and try again.</div>';
    document.getElementById("password").value = "";
    document.getElementById("password").focus();
  }
});
</script>
</body>
</html>

<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Register | Oxygen Gym</title><link rel="stylesheet" href="css/style.css"></head>
<body class="app-bg"><header class="site-header"><a class="brand" href="index.html"><span>O₂</span> OXYGEN <b>GYM</b></a><nav><a href="index.html">Home</a><a href="membership.html">Membership</a><a href="contact.html">Contact</a><a class="btn btn-sm" href="login.html">Login</a></nav></header>
<main class="form-page container"><div class="form-card"><div class="section-head"><p class="eyebrow">BECOME A MEMBER</p><h1>Join <span>Oxygen Gym.</span></h1><p>Create your member profile. Your data is stored locally in this demo project.</p></div>
<form id="registerForm" class="form-grid">
<label>Full Name<input name="name" required placeholder="Enter full name"></label><label>Mobile Number<input name="phone" required pattern="[0-9]{10}" placeholder="10-digit mobile"></label>
<label>Email<input name="email" type="email" required placeholder="you@example.com"></label><label>Date of Birth<input name="dob" type="date" required></label>
<label>Gender<select name="gender" required><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select></label>
<label>Membership Plan<select name="plan" id="plan" required><option value="">Select Plan</option><option>Monthly</option><option>Quarterly</option><option>Half-Yearly</option><option>Yearly</option></select></label>
<label class="full">Address<textarea name="address" rows="3" placeholder="Address"></textarea></label>
<div class="full"><button class="btn" type="submit">Create Membership</button></div>
</form><div id="registerMsg"></div></div></main><script src="js/app.js"></script></body></html>
